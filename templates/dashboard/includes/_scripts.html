{% load static %}
<script src="{% static 'vendor/select2/select2.min.js' %}"></script>
<script>
    $(document).ready(function () {
        var currentPageQuery = "";
        var lastKnownPaymentId = null;

        function formatRupiah(val) {
            return "Rp" + (parseInt(val, 10) || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function applyDashboardSnapshot(data, forceTableUpdate) {
            if (!data) return;
            if (forceTableUpdate || lastKnownPaymentId === null || data.latest_id !== lastKnownPaymentId) {
                if (data.html) {
                    $("#laporan-container").html(data.html);
                }
                lastKnownPaymentId = data.latest_id;
            }
            if (typeof data.uang_bulan_ini !== "undefined") {
                $("#valPemasukanBulanIni").text(formatRupiah(data.uang_bulan_ini));
            }
            if (typeof data.uang_tahun_ini !== "undefined") {
                $("#valKasTahunIni").text(formatRupiah(data.uang_tahun_ini));
            }
            if (data.tunggakan_counts) {
                Object.keys(data.tunggakan_counts).forEach(function (layananKey) {
                    $("#valTunggakan_" + layananKey).text(data.tunggakan_counts[layananKey]);
                });
            }
        }

        window.refreshDashboardWidgets = function (pageQuery, forceUpdate) {
            var q = typeof pageQuery === "string" ? pageQuery : currentPageQuery;
            $.ajax({
                url: "/laporan-recent/" + (q || ""),
                cache: false,
                success: function (data) {
                    applyDashboardSnapshot(data, forceUpdate !== false);
                }
            });
        };

        $(document).on("click", ".page-ajax", function (e) {
            e.preventDefault();
            currentPageQuery = $(this).attr("href") || "";
            window.refreshDashboardWidgets(currentPageQuery, true);
        });

        // Auto-refresh Riwayat Pembayaran Terbaru & KPI secara berkala tanpa reload halaman
        setInterval(function () {
            if (!document.hidden && (!currentPageQuery || currentPageQuery === "?page=1")) {
                window.refreshDashboardWidgets(currentPageQuery, false);
            }
        }, 6000);
    });
</script>
