<!-- Modal Hasil Pembayaran: Sukses & Error Notifications -->
<div class="modal fade" id="paymentSuccessModal" tabindex="-1" role="dialog" aria-labelledby="paymentSuccessModalLabel" aria-hidden="true" style="z-index: 1070;">
    <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 440px;">
        <div class="modal-content border-0 shadow-lg text-center" style="background: var(--surface-1); border-radius: var(--radius-lg);">
            <div class="modal-body p-4">
                <div class="mb-3 text-success">
                    <i class="fas fa-check-circle fa-4x"></i>
                </div>
                <h4 class="font-weight-bold text-main mb-1" id="paymentSuccessModalLabel">Pembayaran Berhasil!</h4>
                <p class="text-muted small mb-3" id="successModalMsg">Transaksi telah berhasil diverifikasi dan tersimpan ke sistem.</p>

                <div class="p-3 rounded mb-3 text-left" style="background: var(--surface-2); border: 1px solid var(--border-subtle);">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted small">Pelanggan:</span>
                        <strong class="text-main small" id="successModalCustNama">-</strong>
                    </div>
                    <div class="d-flex justify-content-between mb-1">
                        <span class="text-muted small">Tagihan Terbayar:</span>
                        <strong class="text-main small" id="successModalDuesCount">0 Tagihan</strong>
                    </div>
                    <div class="d-flex justify-content-between pt-2 border-top mt-2">
                        <span class="font-weight-bold text-main">Total Bayar:</span>
                        <span class="font-weight-bold text-success font-mono" id="successModalTotalBayar" style="font-size: 1.15rem;">Rp 0</span>
                    </div>
                </div>

                <div class="d-flex flex-column gap-2">
                    <a href="#" id="btnSuccessModalPrintStruk" target="_blank" class="btn btn-primary font-weight-bold py-2">
                        <i class="fas fa-print mr-1"></i> Cetak Struk Thermal
                    </a>
                    <button type="button" class="btn btn-secondary py-2" data-dismiss="modal">
                        <i class="fas fa-check mr-1"></i> Selesai
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="paymentErrorModal" tabindex="-1" role="dialog" aria-labelledby="paymentErrorModalLabel" aria-hidden="true" style="z-index: 1070;">
    <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 440px;">
        <div class="modal-content border-0 shadow-lg text-center" style="background: var(--surface-1); border-radius: var(--radius-lg);">
            <div class="modal-body p-4">
                <div class="mb-3 text-danger">
                    <i class="fas fa-exclamation-triangle fa-4x"></i>
                </div>
                <h4 class="font-weight-bold text-main mb-1" id="paymentErrorModalLabel">Pembayaran Gagal</h4>
                <p class="text-muted small mb-3">Terjadi kendala saat memproses transaksi pembayaran.</p>

                <div class="p-3 rounded mb-3 text-left" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3);">
                    <div class="small font-weight-bold text-danger mb-1"><i class="fas fa-info-circle mr-1"></i> Pesan Kesalahan:</div>
                    <div class="text-main small font-mono" id="errorModalMessageDetail" style="word-break: break-word;">-</div>
                </div>

                <button type="button" class="btn btn-secondary btn-block py-2" data-dismiss="modal">
                    <i class="fas fa-arrow-left mr-1"></i> Kembali &amp; Coba Lagi
                </button>
            </div>
        </div>
    </div>
</div>
