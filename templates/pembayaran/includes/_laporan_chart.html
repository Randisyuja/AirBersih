<!-- Monthly Revenue Bar Chart Card -->
<div class="card mb-4" id="cardLaporanChart">
    <div class="card-header d-flex flex-column flex-sm-row align-items-sm-center justify-content-between">
        <div>
            <h6 class="m-0 font-weight-bold text-main">
                <i class="fas fa-chart-line text-primary mr-2"></i>Grafik Pemasukan Bulanan {{ layanan }} ({{ tahun }})
            </h6>
            <small class="text-muted">Tren penerimaan iuran per bulan (Januari – Desember {{ tahun }})</small>
        </div>
        <div class="mt-2 mt-sm-0">
            <span class="badge badge-pill px-3 py-1 font-mono" id="chartActiveFilterBadge" style="background: var(--surface-2); color: var(--text-main); border: 1px solid var(--border-subtle);">
                {{ selected_bulan_label }}
            </span>
        </div>
    </div>
    <div class="card-body">
        <div style="position: relative; height: 280px; width: 100%;">
            <canvas id="monthlyRevenueChart" aria-label="Grafik Pemasukan Bulanan {{ layanan }} {{ tahun }}" role="img"></canvas>
        </div>
    </div>
</div>
