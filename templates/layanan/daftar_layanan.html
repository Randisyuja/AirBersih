{% extends "base.html" %}
{% block content %}
{% load static %}

    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h1 class="h3 mb-3 text-gray-800">Daftar Layanan</h1>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                            <tr>
                                <th>No</th>
                                <th>Nama Layanan</th>
                            </tr>
                        </thead>
                        <tbody>
                        {% for layanan in layanan_list %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ layanan}}</td>>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="3">Belum ada layanan</td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>


{% endblock %}
