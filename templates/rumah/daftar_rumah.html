{% extends "base.html" %}
{% block content %}
{% load static %}

    <div class="container-fluid">
        <div class="card shadow mb-4">
            <div class="card-header py-3">
                <h1 class="h3 mb-3 text-gray-800">Daftar Rumah</h1>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>No</th>
                            <th>RT</th>
                            <th>No Rumah</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody>
                        {% for rumah in rumah_list %}
                            <tr>
                                <td>{{ forloop.counter }}</td>
                                <td>{{ rumah.rt }}</td>
                                <td>{{ rumah.no_rumah }}</td>
                                <td>{{ rumah.status }}</td>
                            </tr>
                        {% empty %}
                            <tr>
                                <td colspan="5">Belum ada data rumah</td>
                            </tr>
                        {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>


{% endblock %}
