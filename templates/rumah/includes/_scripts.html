<script>
    document.addEventListener("DOMContentLoaded", function () {
        const searchInput = document.getElementById("searchRumahInput");
        const clearBtn = document.getElementById("btnClearLiveSearchRumah");
        const resetLiveBtn = document.getElementById("btnResetLiveFilterRumah");
        const tableBody = document.getElementById("rumahTableBody");
        const rows = tableBody ? tableBody.querySelectorAll(".rumah-row") : [];
        const noMatchRow = document.getElementById("noLiveMatchRumahRow");
        const rumahCountBadge = document.getElementById("rumahCountBadge");
        const initialTotal = rows.length;

        function performLiveFilter() {
            if (!searchInput) return;
            const rawVal = searchInput.value.trim().toLowerCase();
            const noSpaceVal = rawVal.replace(/\s+/g, '');
            const strippedVal = rawVal.replace(/^(rt|no\.?)\s*/i, '').trim();
            const strippedNoSpaceVal = noSpaceVal.replace(/^(rt|no\.?)/i, '').trim();

            if (clearBtn) {
                clearBtn.style.display = rawVal.length > 0 ? "inline-block" : "none";
            }

            let visibleCount = 0;

            rows.forEach(function (row) {
                if (rawVal === "") {
                    row.style.display = "";
                    visibleCount++;
                    const numCell = row.querySelector(".row-num");
                    if (numCell) numCell.textContent = visibleCount;
                    return;
                }

                const rt = (row.getAttribute("data-rt") || "");
                const norumah = (row.getAttribute("data-norumah") || "");
                const penghuni = (row.getAttribute("data-penghuni") || "");

                const norumahNoSpace = norumah.replace(/\s+/g, '');
                const rtPadded = rt.length === 1 ? '0' + rt : rt;
                const rtUnpadded = rt.replace(/^0+/, '');

                const matchPenghuni = penghuni.includes(rawVal);
                const matchRT = (
                    rt.includes(rawVal) || 
                    (strippedVal && rt.includes(strippedVal)) ||
                    (strippedVal && rtPadded.includes(strippedVal)) ||
                    (strippedVal && rtUnpadded.includes(strippedVal))
                );
                const matchNoRumah = (
                    norumah.includes(rawVal) || 
                    norumahNoSpace.includes(noSpaceVal) || 
                    (strippedVal && norumah.includes(strippedVal)) ||
                    (strippedNoSpaceVal && norumahNoSpace.includes(strippedNoSpaceVal))
                );

                if (matchRT || matchNoRumah || matchPenghuni) {
                    row.style.display = "";
                    visibleCount++;
                    const numCell = row.querySelector(".row-num");
                    if (numCell) numCell.textContent = visibleCount;
                } else {
                    row.style.display = "none";
                }
            });

            if (noMatchRow) {
                noMatchRow.style.display = (visibleCount === 0 && rows.length > 0) ? "" : "none";
            }

            if (rumahCountBadge) {
                if (rawVal === "") {
                    rumahCountBadge.innerHTML = `Total: <strong>${initialTotal}</strong> Unit`;
                } else {
                    rumahCountBadge.innerHTML = `Ditemukan: <strong>${visibleCount}</strong> dari ${initialTotal} Unit`;
                }
            }
        }

        if (searchInput) {
            searchInput.addEventListener("input", performLiveFilter);
            searchInput.addEventListener("keyup", function (e) {
                if (e.key === "Escape") {
                    clearSearch();
                }
            });
        }

        function clearSearch() {
            if (searchInput) {
                searchInput.value = "";
                performLiveFilter();
                searchInput.focus();
            }
            if (window.location.search.includes("q=")) {
                window.location.href = "{% url 'daftar_rumah' %}";
            }
        }

        if (clearBtn) {
            clearBtn.addEventListener("click", clearSearch);
        }

        if (resetLiveBtn) {
            resetLiveBtn.addEventListener("click", clearSearch);
        }
    });
</script>
