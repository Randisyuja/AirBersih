name: water_pay_prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water_pay_web_prod
    restart: always
    ports:
      - "${PROD_PORT:-80}:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_NAME=${DB_NAME:-airbersih_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - RUN_MIGRATIONS=1
      - COLLECT_STATIC=1
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://127.0.0.1,http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_prod_volume:/app/staticfiles

  db:
    image: postgres:15-alpine
    container_name: water_pay_db_prod
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-airbersih_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-airbersih_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  static_prod_volume:
