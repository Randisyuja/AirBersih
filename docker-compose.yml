name: water_pay

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: water_pay_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8010}:8000"
    environment:
      - DEBUG=${DEBUG:-True}
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-secret-key-change-in-production}
      - DB_NAME=${DB_NAME:-airbersih_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=5432
      - RUN_MIGRATIONS=1
      - COLLECT_STATIC=1
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-1}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-127.0.0.1,localhost,web}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - static_volume:/app/staticfiles

  db:
    image: postgres:15-alpine
    container_name: water_pay_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-airbersih_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT_HOST:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-airbersih_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: water_pay_pgadmin
    restart: unless-stopped
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5055}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  docs:
    image: squidfunk/mkdocs-material
    container_name: water_pay_docs
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8011}:8000"
    volumes:
      - .:/docs

volumes:
  postgres_data:
  static_volume:
  pgadmin_data:
